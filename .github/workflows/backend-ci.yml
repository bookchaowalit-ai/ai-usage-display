name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Syntax-check helper scripts
        run: for f in scripts/*.mjs; do node --check "$f"; done

  # The ESP32 sketch needs arduino-cli + board cores; until that is wired up,
  # at least make sure the real secrets header is never committed.
  firmware-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: secrets.h is not tracked
        run: |
          if git ls-files firmware | grep -E '/secrets\.h$'; then
            echo "firmware secrets.h must not be committed" >&2
            exit 1
          fi
